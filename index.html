<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Поймай сердечко 💘</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #ff9a9e, #fecfef);
    height: 100vh; overflow: hidden;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    user-select: none;
  }
  #hud {
    position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
    background: rgba(255,255,255,0.85);
    padding: 10px 25px; border-radius: 30px;
    font-size: 20px; font-weight: bold; color: #e63946;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    display: flex; gap: 30px; z-index: 10;
  }
  #startScreen, #endScreen {
    background: rgba(255,255,255,0.92);
    padding: 40px 50px; border-radius: 25px; text-align: center;
    box-shadow: 0 15px 40px rgba(0,0,0,0.2);
    z-index: 20; position: absolute;
  }
  #endScreen { display: none; }
  h1 { color: #e63946; margin-bottom: 15px; font-size: 28px; }
  p { color: #555; margin-bottom: 20px; line-height: 1.5; }
  button {
    background: #e63946; color: white; border: none;
    padding: 14px 35px; border-radius: 30px;
    font-size: 18px; font-weight: bold; cursor: pointer;
    transition: 0.2s;
  }
  button:hover { transform: scale(1.07); background: #d62839; }
  .heart {
    position: absolute; font-size: 40px; cursor: pointer;
    transition: transform 0.1s; z-index: 5;
    animation: pulse 1s infinite;
  }
  .heart:hover { transform: scale(1.2); }
  @keyframes pulse {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }
  .pop {
    position: absolute; font-size: 24px; color: #e63946;
    font-weight: bold; pointer-events: none;
    animation: rise 0.8s ease forwards; z-index: 15;
  }
  @keyframes rise {
    0% { opacity: 1; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(-60px); }
  }
</style>
</head>
<body>

<div id="hud">
  <span>💖 Счёт: <span id="score">0</span></span>
  <span>⏱️ <span id="time">30</span>с</span>
</div>

<div id="startScreen">
  <h1>Поймай сердечко сигму!! 💘</h1>
  <p>Нажимай на жопы сердечки и набери дохуя очка<br>за 30 секунд. Удачи, любимый!! 🥰</p>
  <button onclick="startGame()">Начать жополов 💕</button>
</div>

<div id="endScreen">
  <h1 id="endTitle">Время dead</h1>
  <p id="endText"></p>
  <button onclick="restart()">Поиграть еще разок(я в тебя верю, Димка 🔁</button>
</div>

<script>
  let score = 0;
  let timeLeft = 30;
  let timer = null;
  let spawner = null;
  let playing = false;

  const scoreEl = document.getElementById('score');
  const timeEl = document.getElementById('time');
  const startScreen = document.getElementById('startScreen');
  const endScreen = document.getElementById('endScreen');

  const emojis = ['💖','💘','💕','❤️','💗','💝'];

  function startGame() {
    score = 0; timeLeft = 30; playing = true;
    scoreEl.textContent = 0;
    timeEl.textContent = 30;
    startScreen.style.display = 'none';
    endScreen.style.display = 'none';

    timer = setInterval(() => {
      timeLeft--;
      timeEl.textContent = timeLeft;
      if (timeLeft <= 0) endGame();
    }, 1000);

    spawner = setInterval(spawnHeart, 550);
    spawnHeart();
  }

  function spawnHeart() {
    if (!playing) return;
    const h = document.createElement('div');
    h.className = 'heart';
    h.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    const x = Math.random() * (window.innerWidth - 60);
    const y = Math.random() * (window.innerHeight - 120) + 80;
    h.style.left = x + 'px';
    h.style.top = y + 'px';

    h.addEventListener('click', (e) => {
      e.stopPropagation();
      score += 10;
      scoreEl.textContent = score;
      showPop(h.style.left, h.style.top, '+10');
      h.remove();
    });

    document.body.appendChild(h);

    setTimeout(() => { if (h.parentNode) h.remove(); }, 2000);
  }

  function showPop(left, top, text) {
    const p = document.createElement('div');
    p.className = 'pop';
    p.textContent = text;
    p.style.left = left;
    p.style.top = top;
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 800);
  }

  function endGame() {
    playing = false;
    clearInterval(timer);
    clearInterval(spawner);
    document.querySelectorAll('.heart').forEach(h => h.remove());
    endScreen.style.display = 'block';

    let msg = '';
    if (score >= 150) msg = `Вау! ${score} очков! 🏆 НИХУЯ СЕБЕ ТЫ МОЖЕШЬ 💖`;
    else if (score >= 80) msg = `Отлично! ${score} очков! 🥰 НУ ЕБАШИШЬ ДИКО`;
    else if (score >= 40) msg = `${score} очков! Неплохо! 😘 АЙ ТЫ КРУТОЙ`;
    else msg = `Всего ${score}… 😅 ЦИФРЫ ПОДКРУЧЕНЫ, НЕ ВЕРЬ ИМ, ТЫ САМЫЙ КРУТОЙ 💕`;

    document.getElementById('endTitle').textContent = 'Врэмя все. Ты умница, Димчик ⏰';
    document.getElementById('endText').textContent = msg;
  }

  function restart() {
    endScreen.style.display = 'none';
    startScreen.style.display = 'block';
  }
</script>
</body>
</html>
